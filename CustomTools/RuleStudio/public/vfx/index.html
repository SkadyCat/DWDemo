<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DWDemo · 特效实验室</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; color: #e7e2d4; font: 14px 'Noto Serif SC', serif; }
  #stage { position: fixed; inset: 0; }
  .bar { position: fixed; left: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 70vw; z-index: 2; }
  .bar button { padding: 6px 14px; color: #fbe7b0; font: 14px 'ZCOOL XiaoWei', serif; letter-spacing: .1em; background: rgba(10, 17, 36, .85); border: 1px solid rgba(216, 180, 106, .5); border-radius: 16px; cursor: pointer; }
  .bar button:hover, .bar button.on { border-color: #fbe7b0; box-shadow: 0 0 12px rgba(251, 231, 176, .35); }
  h1 { position: fixed; right: 20px; top: 12px; margin: 0; font: 400 22px 'ZCOOL XiaoWei', serif; letter-spacing: .4em; color: #fbe7b0; z-index: 2; }
</style>
</head>
<body>
<div id="stage"></div>
<h1>特 效 实 验 室</h1>
<div class="bar" id="bar"></div>
<script type="module">
import { mountLab } from '/vfx/lab.mjs';
mountLab(document.getElementById('stage'), document.getElementById('bar'));
</script>
</body>
</html>
