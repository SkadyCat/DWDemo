<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>道具与技能图标 · RuleStudio</title><link rel="stylesheet" href="/app.css">
<style>
body{display:block;height:auto;overflow:auto;background:#0b1019}main{height:auto;max-width:1180px;margin:auto;padding:28px}h1{font-size:25px;margin:0 0 8px}.intro{color:#91a1b8;margin:0 0 25px}.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}.sheet{border:1px solid #303b4e;border-radius:12px;padding:14px;background:#121b29}.sheet h2{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:12px}.sheet h2 a{color:#91caff;text-decoration:none;font-size:11px}.icons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.icon{min-width:0;text-align:center;text-decoration:none;color:#c3cddd}.icon img{width:100%;height:auto;aspect-ratio:1;display:block;border:1px solid #536176;border-radius:7px;background:#080b11}.icon span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;padding-top:5px}.samples{display:flex;align-items:center;gap:10px;margin:20px 0;color:#91a1b8;font-size:11px}.samples img{border:1px solid #637893;border-radius:4px}footer{margin-top:24px;color:#8192aa;font-size:11px}
</style></head><body><main><h1>道具与技能图标</h1><p class="intro">魔兽风 · 粗轮廓 · 低细节 · 每页 3 × 3 · 独立 PNG 256 × 256</p><div class="samples"><img src="/assets/icons/warcraft-v1/skill/frost_lance.png" width="32" height="32" alt="32px 冰锥术"><img src="/assets/icons/warcraft-v1/item/healing_draught.png" width="32" height="32" alt="32px 气血药剂"><img src="/assets/icons/warcraft-v1/equipment/frostthorn_staff.png" width="32" height="32" alt="32px 霜棘法杖"><span>32px 实际显示尺寸</span></div><div class="sheets" id="sheets"></div><footer>图片无文字；名称由网页标注。点击图标查看独立 PNG。</footer></main><script type="module">
import {ICON_SHEETS,ICON_ENTRIES,ICON_ROOT} from '/icon-catalog.mjs';
const root=document.querySelector('#sheets');
for(const sheet of ICON_SHEETS){const section=document.createElement('section');section.className='sheet';const heading=document.createElement('h2');heading.append(document.createTextNode(sheet.name));const link=document.createElement('a');link.href=`${ICON_ROOT}/sheets/${sheet.id}.png`;link.textContent='3×3 图集';heading.append(link);section.append(heading);const grid=document.createElement('div');grid.className='icons';for(const icon of ICON_ENTRIES.filter(i=>i.sheet===sheet.id)){const a=document.createElement('a');a.className='icon';a.href=icon.src;const img=document.createElement('img');img.src=icon.src;img.alt=icon.name;img.width=256;img.height=256;const name=document.createElement('span');name.textContent=icon.name;a.append(img,name);grid.append(a)}section.append(grid);root.append(section)}
</script></body></html>
