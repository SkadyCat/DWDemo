<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>特效预览 · RuleStudio</title><link rel="stylesheet" href="/vfx/preview.css"><script type="module" src="/vfx/preview.mjs"></script></head>
<body>
<header><a href="/">← RuleStudio</a><b>特效预览</b><span>THREE.JS / VFX PREFABS</span><output id="stats">准备渲染</output></header>
<main>
  <aside><div class="list-head"><h1>特效库</h1><span id="total"></span></div><input id="search" type="search" aria-label="搜索特效" placeholder="搜索特效…"><div id="catalog"></div></aside>
  <section id="stage" aria-label="Three.js 特效预览"><div class="title"><small id="category"></small><h2 id="name"></h2><p id="description"></p></div><div class="stage-label">拖动旋转 · 滚轮缩放</div><div class="controls"><button id="restart">重新播放</button><button id="pause">暂停</button><label>速度 <select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label><input id="glow" type="checkbox" checked> 柔光</label><label><input id="target" type="checkbox" checked> 参照物</label><label>半径 <input id="radius" type="range" min=".5" max="4" value="2" step=".1"><output id="radius-value">2.0 m</output></label><label>时间 <input id="timeline" type="range" min="0" max="3" value="0" step=".01"></label></div></section>
</main><div id="error" role="alert" hidden></div>
</body></html>
