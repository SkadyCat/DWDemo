<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地图层级 · 实际地图装配验收</title>
<link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/play.css"><link rel="stylesheet" href="/atlas-map.css">
<style>body{display:block;background:#090c12}#tier-qa{position:fixed;bottom:4px;left:24px;z-index:3000;display:flex;align-items:center;gap:10px;padding:7px 12px;background:#101a24;color:#b5c5cf;font-size:12px}#tier-qa button{padding:4px 12px}</style>
</head><body><div id="app"></div><script type="module">
import {createApp,reactive,ref} from '/vendor/vue.esm-browser.prod.js';
import {AtlasMap} from '/atlas-map.mjs';
import {AtlasSession} from '/atlas-session.mjs';
import {travelAtlas} from '/atlas-travel.mjs';
import {iconSrc} from '/game-icons.mjs';
import {reloadStore} from '/editors.mjs';
if(location.hostname!=='127.0.0.1'||location.port!=='5340')throw Error('Use the isolated verification origin 5340');
await reloadStore();
const docs=new Map([1,3,16].map(tier=>{const id=`map_t${String(tier).padStart(2,'0')}_common`;return [id,{doc:{id,tier,category:'map',name:`地图 T${tier} · 普通`,rarity:'common',description:`进入第 ${tier} 层地图。`}}];}));
const session=new AtlasSession(null,{seed:1});
const initial=session.prepare('0:0');const first={floor:1,phase:'cleared',hero:{dead:false}};session.bind(initial,first);session.observe(first);
const next=session.state.nodes.find(n=>n.status==='available');session.select(next.id);
const owner={owned:{item:Object.fromEntries([...docs.keys()].map(id=>[id,1]))},mapDeviceSlots:{}};
const state=ref(session.state),slots=ref({}),feedback=ref('生产星图组件 · 独立验收数据'),items=ref([...docs.values()].map(({doc})=>({...doc,kind:'item',key:'item:'+doc.id,count:1,iconSrc:iconSrc('item',doc)})));
function mount(tier){slots.value=tier?{map:`item:map_t${String(tier).padStart(2,'0')}_common`}:{};owner.mapDeviceSlots=slots.value;}
function enter(id){try{const result=travelAtlas(session,owner,{item:docs},id,p=>({floor:p.options.floor,phase:'ready',hero:{dead:false}}));state.value=session.state;slots.value=owner.mapDeviceSlots;items.value=items.value.map(item=>({...item,count:owner.owned.item[item.id]||0}));feedback.value=`已进入 T${result.battle.floor} · 中央地图已消耗`;}catch(error){feedback.value=error.message;}}
createApp({components:{AtlasMap},setup:()=>({state,slots,items,feedback,mount,enter,select(id){session.select(id);state.value=session.state;},change(value){slots.value=value;owner.mapDeviceSlots=value;}}),template:`<AtlasMap :state="state" :device-items="items" :device-slots="slots" @select="select" @device-change="change" @challenge="enter"/><aside id="tier-qa"><span>{{feedback}}</span><button @click="mount(0)">取下地图</button><button @click="mount(1)">放入 T1</button><button @click="mount(3)">放入 T3</button><button @click="mount(16)">放入 T16</button></aside>`}).mount('#app');
</script></body></html>
