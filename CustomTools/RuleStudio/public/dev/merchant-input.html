<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拓荒商人 · 右键交易验收</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/play.css"><style>body{display:block;background:radial-gradient(ellipse at center,#26313d,#10151e 75%)}#qa-receipt{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:20020;background:#101d28;padding:6px 12px;color:#b5d8ca;font-size:12px;white-space:nowrap}</style></head><body><div id="app"></div><script type="module">
import {createApp,ref} from '/vendor/vue.esm-browser.prod.js';
import {reloadStore,store} from '/editors.mjs';
import {player,ensureStarted} from '/player.mjs';
import {registerEquipmentDropLibrary} from '/equipment-generation.mjs';
import {BattleOutpostMerchant} from '/battle-outpost-merchant.mjs';
if(location.hostname!=='127.0.0.1'||location.port!=='5351')throw Error('Merchant input QA requires isolated loopback origin 5351');
await reloadStore();ensureStarted(store.catalog,store.collections,store.library);registerEquipmentDropLibrary(store.files,store.library,store.affixCategories);
if(!player.outpostMerchant)player.stones=20000;
const qaWallet=new URLSearchParams(location.search).get('wallet');
if(qaWallet!==null&&Number.isSafeInteger(Number(qaWallet))&&Number(qaWallet)>=0)player.stones=Number(qaWallet);
createApp({components:{BattleOutpostMerchant},setup(){return {player,opened:ref(true),info:{visible:false,x:0,y:0}};},template:`<BattleOutpostMerchant :info="info" :open="opened" :world-seed="41" @close="opened=false"/><output id="qa-receipt">独立验收 · 灵石 {{player.stones}} · T1地图 {{player.owned.item.map_t01_common||0}} · 装备 {{Object.keys(player.instances).length}}</output>`}).mount('#app');
</script></body></html>
