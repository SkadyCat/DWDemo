<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>传送阵 · UICreator 设计预览</title>
<link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/play.css">
<style>
body{display:block;padding:32px 40px;overflow:auto;background:#0b1016;color:#d8e3ea}main{max-width:1040px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:20px;color:#ead3a0;margin:0 0 5px}p{color:#8c9caa;margin:0;font-size:12px}.tools{display:flex;gap:6px}.tools button{background:#15222d;border:1px solid #334b55;border-radius:5px;padding:7px 13px;color:#aac5c6;cursor:pointer}.tools button.on{border-color:#75bca6;color:#dfdfb9;background:#1a3035}#world{height:420px;position:relative;overflow:hidden;border:1px solid #293c46;border-radius:12px;background:#17191e}#world canvas{width:100%;height:100%;display:block}#portal-preview{position:absolute;inset:0}.world-caption{position:absolute;left:20px;top:16px;color:#8a9b9c;font-size:11px;pointer-events:none}.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.swatch{position:relative;height:132px;background:#101923;border:1px solid #263844;border-radius:9px}.swatch>p{position:absolute;top:14px;left:17px;font-size:11px;color:#899aab}.swatch .b3-exit-portal{margin-top:6px}.notes{display:flex;gap:26px;margin-top:22px;font-size:12px;color:#799295}.notes span::before{content:'·';color:#94c6b5;margin-right:7px}#action{font-size:11px;color:#b3d3be;margin-top:15px;min-height:20px}@media(max-width:800px){body{padding:18px}.swatches{grid-template-columns:1fr}header{gap:10px;flex-wrap:wrap}}
</style></head><body><main><header><div><h1>地牢出口 · 传送阵</h1><p>UICreator 控件预览 · 复用 Studio 的真实控件与传送阵模型</p></div><div class="tools"><button data-mode="far" class="on">远处</button><button data-mode="near">走近</button><button data-mode="travel">前往中</button></div></header>
<div id="world"><div class="world-caption">3D 场景尺寸预览</div><div id="portal-preview"></div></div><section class="swatches" id="swatches"></section><div class="notes"><span>单一操作 · 前往世界地图</span><span>远处自动前往 · 到达后打开</span><span>悬停提亮 · 按下反馈</span></div><output id="action">点击浮牌可验证激活事件。</output></main><script type="module" src="/dev/portal-ui.mjs"></script></body></html>
