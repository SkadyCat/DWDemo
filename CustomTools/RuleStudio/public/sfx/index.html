<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>音效试听</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 32px 24px; font: 14px/1.6 "Noto Serif SC", serif; background: #070b18; color: #e6e2d6; }
  h1 { font-weight: 400; letter-spacing: .3em; color: #f3dfa5; margin: 0 0 4px; }
  p { color: #9a9aa8; margin: 0 0 20px; }
  section { margin-bottom: 18px; } h2 { font-weight: 400; font-size: 15px; letter-spacing: .2em; color: #c9a86a; margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button { padding: 7px 14px; border-radius: 18px; border: 1px solid #6b5630; background: #0f1630; color: #f0e6c8; font: inherit; cursor: pointer; }
  button:hover { border-color: #f3dfa5; } label { margin-left: 12px; color: #9a9aa8; }
</style></head>
<body>
<h1>音 效 试 听</h1>
<p>游戏里的所有音效都是现场合成的（public/game/audio.mjs）。点一下就播，听着哪个不对，说出它的名字和想要的感觉就行。</p>
<div id="list"></div>
<script type="module">
import { sfx, setLoop, audio } from '/game/audio.mjs';
const groups = {
  '界面': [['click'], ['open'], ['close'], ['equip'], ['unequip'], ['craftFail']],
  '洗炼': ['augment', 'chaos', 'upgrade', 'annul', 'seal', 'temper', 'essence_core', 'skill_gem'].map(k => ['craft', { kind: k }, k]),
  '掉落与拾取': [['drop', { tier: 1 }, '普通'], ['drop', { tier: 2 }, '魔法'], ['drop', { tier: 3 }, '稀有'], ['drop', { tier: 4 }, '传奇 / ◆◆◆'], ['stoneDrop', {}, '路石'], ['pickup', { rarity: 'rare' }, '拾取'], ['coin', {}, '通货']],
  '施法': ['fire', 'cold', 'lightning', 'chaos', 'physical'].map(el => ['cast', { el }, el]),
  '战斗': [['swing'], ['swing', { heavy: true }, 'swing 重'], ['hit'], ['hit', { crit: true }, 'hit 暴击'], ['hit', { el: 'fire' }, 'hit 火'], ['boom'], ['boom', { big: true }, 'boom 大'], ['boom', { el: 'cold' }, 'boom 冰'], ['zap'], ['thunder'], ['shatter'], ['slam'], ['blink'], ['summon'], ['telegraph'], ['hurt']],
  '击杀': [['kill'], ['eliteKill'], ['bossKill']],
  '世界与剧情': [['mapStart'], ['portal'], ['quest'], ['chapter'], ['story']],
};
const root = document.getElementById('list');
for (const [g, list] of Object.entries(groups)) {
  const sec = document.createElement('section'); sec.innerHTML = `<h2>${g}</h2><div class="row"></div>`;
  for (const [name, opts = {}, label] of list) { const b = document.createElement('button'); b.textContent = label ?? name; b.onclick = () => sfx(name, opts); sec.querySelector('.row').append(b); }
  root.append(sec);
}
const loops = document.createElement('section'); loops.innerHTML = '<h2>循环</h2><div class="row"><button data-l="wind">风（龙卷风）</button><button data-l="drone">地图底噪</button></div>';
loops.querySelectorAll('button').forEach(b => { let on = false; b.onclick = () => { on = !on; setLoop(b.dataset.l, on ? 1 : 0); b.style.borderColor = on ? '#f3dfa5' : ''; }; });
root.append(loops);
const vol = document.createElement('label'); vol.innerHTML = `音量 <input type="range" min="0" max="1" step="0.05" value="${audio.volume}">`;
vol.querySelector('input').oninput = e => audio.setVolume(+e.target.value); root.prepend(vol);
</script>
</body></html>
