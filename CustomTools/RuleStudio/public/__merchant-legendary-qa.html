<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>低阶商人价格验证</title>
<link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/play.css"><link rel="stylesheet" href="/tower-rewards.css">
<style>body{margin:0;background:#101724;min-height:100vh;display:grid;grid-template-columns:1fr;place-items:center}#app{position:relative;width:420px;height:690px}.b3-completion{top:12px;right:12px;max-height:666px}</style>
<div id="app"></div><script type="module">
import {createApp, reactive} from '/vendor/vue.esm-browser.prod.js';
import {checkRuleSet} from '/engine/index.mjs';
import {FloorRewards} from '/engine/floor-rewards.mjs';
import {BattleCompletion} from '/battle-completion.mjs';
const {files} = await (await fetch('/api/rules')).json();
const check = checkRuleSet(files); if (!check.ok) throw new Error(check.error);
const rewards = new FloorRewards(check.collections, check.library, check.catalog, {seed:11, merchantChance:1, maxTier:1});
const merchant = reactive(rewards.complete());
createApp({components:{BattleCompletion}, setup(){return {merchant, library:check.library};},
template:'<BattleCompletion :floor="1" :max-floor="100" :merchant="merchant" :wallet="100" :unclaimed="0" :library="library" />'}).mount('#app');
</script></html>
