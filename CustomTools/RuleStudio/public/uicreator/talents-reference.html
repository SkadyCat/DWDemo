<!doctype html><meta charset="utf-8"><title>原版星盘 · 1600×900 对照</title>
<style>body{margin:0;background:#070a10;color:#cfbc91;font:13px system-ui}header{height:38px;display:flex;align-items:center;padding-left:12px}.frame{width:1120px;height:630px;overflow:hidden}iframe{border:0;width:1600px;height:900px;transform:scale(.7);transform-origin:0 0}</style>
<header>未改动的 RuleStudio 3D 星盘 · 1600 × 900 · 70% <button id="capture">导出布局</button><button id="hover">传奇悬停</button><button id="attribute">属性选择</button><button id="fixture">隔离页面：9 点测试方案</button><button id="legend">传奇详情</button><button id="search">搜索示例</button><button id="attrhover">属性悬停</button><button id="notice">无法到达</button><span id="status"></span></header><div class="frame"><iframe title="原版 RuleStudio 星盘" src="/?view=battle&panel=talents"></iframe></div>
<textarea id="snapshot" aria-label="原版布局导出 JSON" readonly style="width:1274px;height:80px"></textarea>
<script type="module">
const frame=document.querySelector('iframe'),status=document.querySelector('#status');
const properties=['display','position','boxSizing','backgroundColor','backgroundImage','color','borderTopColor','borderTopWidth','borderRightColor','borderRightWidth','borderBottomColor','borderBottomWidth','borderLeftColor','borderLeftWidth','borderTopLeftRadius','paddingTop','paddingRight','paddingBottom','paddingLeft','fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','textAlign','whiteSpace','opacity','overflow','overflowX','overflowY','boxShadow','textShadow','alignItems','justifyContent','gap'];
function capture(){
 const d=frame.contentDocument,w=frame.contentWindow,root=d.querySelector('.b3-window-talents');if(!root){status.textContent='星盘尚未载入';return;}
 const style=e=>{const s=w.getComputedStyle(e);return Object.fromEntries(properties.map(k=>[k,s[k]]));};
 const rect=e=>e.getBoundingClientRect().toJSON();let serial=0;
 const graphic=e=>{const c=e.cloneNode(true),a=[e,...e.querySelectorAll('*')],b=[c,...c.querySelectorAll('*')],props=['fill','fill-opacity','stroke','stroke-width','stroke-opacity','stroke-dasharray','stroke-linecap','stroke-linejoin','opacity','vector-effect','font-family','font-size','font-weight','text-anchor','letter-spacing','stop-color','stop-opacity'];for(let i=0;i<a.length;i++){const s=w.getComputedStyle(a[i]);for(const k of props){const value=s.getPropertyValue(k);if(value)b[i].setAttribute(k,value);}b[i].removeAttribute('style');b[i].removeAttribute('class');}return new XMLSerializer().serializeToString(c);};
 function html(e){const s=style(e),r=rect(e);if(s.display==='none'||r.width===0||r.height===0)return null;const record={id:'dom-'+serial++,tag:e.localName,classes:e.getAttribute('class')||'',rect:r,style:s,texts:[],children:[]};
  if(e.matches('.stc-map')){record.tag='graph';record.viewBox=e.getAttribute('viewBox');record.paths=[...e.querySelectorAll('[data-edge]')].map(p=>({id:p.dataset.edge,d:p.getAttribute('d'),stroke:w.getComputedStyle(p).stroke,width:w.getComputedStyle(p).strokeWidth,opacity:w.getComputedStyle(p).strokeOpacity}));record.points=[...e.querySelectorAll('[data-node]')].map(g=>({id:g.dataset.node,rect:rect(g),bbox:(()=>{const b=g.getBBox();return{x:b.x,y:b.y,width:b.width,height:b.height};})(),svg:g.classList.contains('origin')?graphic(g):undefined,label:g.getAttribute('aria-label'),classes:g.getAttribute('class')}));return record;}
  if(e.namespaceURI==='http://www.w3.org/2000/svg'){record.tag='svg';record.svg=graphic(e);record.viewBox=e.getAttribute('viewBox')||`0 0 ${r.width} ${r.height}`;return record;}
  for(const n of e.childNodes)if(n.nodeType===3&&n.textContent.trim()){const range=d.createRange();range.selectNodeContents(n);record.texts.push({text:n.textContent.trim(),rect:range.getBoundingClientRect().toJSON()});}
  if(e.matches('input,select')){record.value=e.value;record.placeholder=e.getAttribute('placeholder')||'';record.label=e.getAttribute('aria-label')||'';if(e.localName==='select')record.options=[...e.options].map(o=>({value:o.value,text:o.text}));}
  for(const c of e.children){if(['script','style','option'].includes(c.localName))continue;const child=html(c);if(child)record.children.push(child);}return record;
 }
 const skins={},svgNS='http://www.w3.org/2000/svg',sampler=d.createElementNS(svgNS,'svg');sampler.style.cssText='position:fixed;left:-10000px;top:0;width:96px;height:96px';d.body.append(sampler);
 for(const g of d.querySelectorAll('.stc-map [data-node]')){const kind=['origin','legendary','attribute'].find(k=>g.classList.contains(k)),r=g.querySelector('.stc-node-core').getAttribute('r'),key=kind+'-'+r;if(skins[key])continue;const c=g.cloneNode(true);c.removeAttribute('transform');c.removeAttribute('data-node');sampler.replaceChildren(c);const b=c.getBBox(),states=[];
  for(let mask=0;mask<16;mask++){c.setAttribute('class',`stc-node ${kind} ${mask&1?'lit':''} ${mask&2?'selected':''} ${mask&4?'available':''}`);const token='#010203';c.style.setProperty('--node-color',token);const circles=[...c.querySelectorAll(':scope > circle')].filter(v=>!v.classList.contains('stc-hit')).map(v=>{const s=w.getComputedStyle(v),core=v.classList.contains('stc-node-core');let stroke=s.stroke,width=parseFloat(s.strokeWidth);if((mask&8)&&core){stroke='rgb(246, 220, 168)';width=1.2;}return{cx:(parseFloat(v.getAttribute('cx')||0)-b.x)/b.width,cy:(parseFloat(v.getAttribute('cy')||0)-b.y)/b.height,r:parseFloat(v.getAttribute('r'))/b.width,fill:s.fill==='rgb(1, 2, 3)'?'node':s.fill,fillOpacity:parseFloat(s.fillOpacity),stroke:stroke==='rgb(1, 2, 3)'?'node':stroke,strokeOpacity:parseFloat(s.strokeOpacity),width};});states.push({mask,circles});}
  skins[key]={kind,r:Number(r),bbox:{x:b.x,y:b.y,width:b.width,height:b.height},states};
 }sampler.remove();
 const output={schema:'rulestudio-html-reference/v1',url:frame.src,viewport:{width:w.innerWidth,height:w.innerHeight},capturedAt:new Date().toISOString(),root:html(root),skins,sourceCss:[...d.styleSheets].filter(s=>s.href?.includes('/talents/')).map(s=>({url:s.href,rules:[...s.cssRules].map(r=>r.cssText)}))};
 document.querySelector('#snapshot').value=JSON.stringify(output);status.textContent=`已读取 ${serial} 个原版 HTML 控件`;
}
document.querySelector('#capture').onclick=capture;
document.querySelector('#hover').onclick=()=>{const d=frame.contentDocument;d.querySelector('.stc-node-dialog .stc-dialog-close')?.click();setTimeout(()=>d.querySelector('.stc-node.legendary.lit,.stc-node.legendary')?.focus(),50);};
document.querySelector('#attribute').onclick=()=>{const d=frame.contentDocument;d.querySelector('.stc-node-dialog .stc-dialog-close')?.click();d.querySelector('.stc-node.attribute.available')?.dispatchEvent(new MouseEvent('click',{bubbles:true}));};
const wait=()=>new Promise(r=>setTimeout(r,60));
document.querySelector('#fixture').onclick=async()=>{try{
 if(location.port!=='5297')throw Error('只允许在隔离的 5297 验证页面创建测试方案');
 const d=frame.contentDocument,t=await fetch('/talent-data/constellation.json').then(r=>r.json()),nodes=new Map(t.nodes.map(n=>[n.id,n])),adj=new Map(t.nodes.map(n=>[n.id,[]]));for(const[a,b]of t.edges){adj.get(a).push(b);adj.get(b).push(a);}
 const chosen=['embers_hub','shield_arm_1_7'],seen=new Set(['origin',...chosen]);for(const id of seen)for(const next of adj.get(id)){if(chosen.length>=8)break;if(!seen.has(next)&&nodes.get(next).kind==='attribute'){seen.add(next);chosen.push(next);}}
 const attrs=['intelligence','intelligence','dexterity','constitution','intelligence','intelligence','dexterity','constitution'];
 for(let i=0;i<chosen.length;i++){d.querySelector(`[data-node="${chosen[i]}"]`).dispatchEvent(new MouseEvent('click',{bubbles:true}));await wait();const labels={strength:'力量',dexterity:'敏捷',intelligence:'智力',constitution:'体质'};d.querySelector(`.stc-attribute-icons button[aria-label="${labels[attrs[i]]} +10"]`).click();await wait();}
 d.querySelector('[data-node="overflow_cast"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));await wait();d.querySelector('.stc-node-actions .stc-primary').click();await wait();d.querySelector('.stc-dialog-close').click();status.textContent='测试方案：8 个属性点 + 溢盾施法；用户页面未改动';
 }catch(e){status.textContent=e.stack;}};
document.querySelector('#legend').onclick=()=>{const d=frame.contentDocument;d.querySelector('.stc-node-dialog .stc-dialog-close')?.click();d.querySelector('.stc-node.legendary.lit')?.dispatchEvent(new MouseEvent('click',{bubbles:true}));};
document.querySelector('#attrhover').onclick=()=>{const d=frame.contentDocument;d.querySelector('.stc-dialog-close')?.click();setTimeout(()=>d.querySelector('.stc-node.attribute')?.focus(),50);};
document.querySelector('#notice').onclick=()=>{const d=frame.contentDocument;d.querySelector('.stc-dialog-close')?.click();d.querySelector('.stc-node.legendary:not(.lit):not(.available)').dispatchEvent(new MouseEvent('click',{bubbles:true}));};
document.querySelector('#search').onclick=()=>{if(location.port!=='5297')return;const d=frame.contentDocument;d.querySelector('.stc-dialog-close')?.click();const input=d.querySelector('.stc-search input');input.value='护盾';input.dispatchEvent(new Event('input',{bubbles:true}));};
</script>
