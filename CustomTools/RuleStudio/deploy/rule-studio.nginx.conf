# RuleStudio: public 5590 -> SSH loopback 15290 -> local 5290.
server {
    listen 5590;
    server_name 43.139.72.98;
    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    add_header X-RuleStudio-Public "1" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        # Keep the existing editor API; browser writes must originate on this site.
        set $rule_studio_request "$request_method:$http_origin";
        if ($rule_studio_request !~ "^(GET|HEAD):|^(PUT|DELETE):http://43[.]139[.]72[.]98:5590$") { return 403; }
        proxy_pass http://127.0.0.1:15290;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:5290;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
